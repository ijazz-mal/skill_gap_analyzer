<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roadmap</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <h1>Your roadmap: {{ role }}</h1>
    <p>Readiness score: {{ score }}%</p>
    <progress value="{{ score }}" max="100"></progress>
    <ol>
      {% for gap in gaps %}
      <li>
        <strong>{{ gap.skill }}</strong>
        {% if gap.skill in done %}(done){% endif %} {% for r in gap.resources %}
        <br /><a href="{{ r.url }}">{{ r.title }}</a> [{{ r.cost }}] {% endfor
        %}
        <form method="post" action="/toggle">
          <input type="hidden" name="skill" value="{{ gap.skill }}" />
          <button type="submit">
            {% if gap.skill in done %}Undo{% else %}Mark done{% endif %}
          </button>
        </form>
      </li>
      {% endfor %}
    </ol>
    <a href="/report">Gap report</a> | <a href="/profile">Edit profile</a> |
    <a href="/logout">Log out</a>
  </body>
</html>
