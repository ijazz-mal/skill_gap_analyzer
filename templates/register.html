<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Skill Gap Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="auth">
  <aside class="auth-panel">
    <a href="/" class="brand"><span>Skill Gap Analyzer</span></a>
    <div class="auth-copy">
      <h1>Start with your degree. Leave with a plan.</h1>
      <p>Create an account, tell us what you know, and get your first skill gap report.</p>
    </div>
    <div class="auth-note">Your password is stored as a hash, never as plain text.</div>
  </aside>
  <main class="auth-main">
    <form class="auth-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <h2>Create your account</h2>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password (8+ characters)</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button type="submit">Sign up</button>
      <div class="auth-alt">Already have an account? <a href="/login">Sign in</a></div>
    </form>
  </main>
</div>
</body>
</html>
