<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Skill Gap Analyzer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <header class="header">
      <a href="/" class="brand"><span>Skill Gap Analyzer</span></a>
      <nav class="nav">
        {% if session.user_id %}
        <a href="/roadmap">My roadmap</a>
        <a href="/report">Gap report</a>
        <a href="/profile">Edit profile</a>
        <a href="/logout" class="btn btn-outline">Log out</a>
        {% else %}
        <a href="/login" class="btn btn-outline">Sign in</a>
        <a href="/register" class="btn btn-primary">Sign up</a>
        {% endif %}
      </nav>
    </header>
    {% block content %}{% endblock %}
  </body>
</html>
