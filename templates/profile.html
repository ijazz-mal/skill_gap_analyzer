{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<main class="page">
  <h1>Your profile</h1>
  <form method="post" class="card">
    <div class="field">
      <label for="role">Target role</label>
      <select id="role" name="role">
        {% for role in roles %}
        <option {% if role == saved_role %}selected{% endif %}>{{ role }}</option>
        {% endfor %}
      </select>
    </div>
    <h2>Skills you already have</h2>
    <div class="checks">
      {% for skill in all_skills %}
      <label class="check"><input type="checkbox" name="skills" value="{{ skill }}" {% if skill in saved_skills %}checked{% endif %}> {{ skill }}</label>
      {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary btn-lg">Analyze my skill gap</button>
  </form>
</main>
{% endblock %}
