<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Skill Gap Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="auth">
  <aside class="auth-panel">
    <a href="/" class="brand"><span>Skill Gap Analyzer</span></a>
    <div class="auth-copy">
      <h1>Welcome back. Pick up where you left off.</h1>
      <p>Your gap report, roadmap and readiness score are waiting for you.</p>
    </div>
    <div class="auth-note">Your password is stored as a hash, never as plain text.</div>
  </aside>
  <main class="auth-main">
    <form class="auth-form" method="post">
      <h2>Sign in</h2>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
      <div class="auth-alt">New here? <a href="/register">Create an account</a></div>
    </form>
  </main>
</div>
</body>
</html>
